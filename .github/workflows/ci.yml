name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: hassfest
        # Fails on the requirements check until yarbo-local is on PyPI.
        continue-on-error: true
        uses: home-assistant/actions/hassfest@master
      - name: HACS
        uses: hacs/action@main
        with:
          category: integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The build in custom_components is committed and current
        run: git diff --exit-code -- ../custom_components/yarbo_local/www

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Home Assistant, and the latest release.
        phcc: ["0.13.346", "0.13.364"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: yarbo-local-ha
      - uses: actions/checkout@v7
        with:
          repository: yarbo-local/yarbo-local
          path: yarbo-local
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      - name: Install
        working-directory: yarbo-local-ha
        run: |
          uv sync --group dev
          uv pip install "pytest-homeassistant-custom-component==${{ matrix.phcc }}"
      - name: Lint
        working-directory: yarbo-local-ha
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        working-directory: yarbo-local-ha
        run: uv run mypy
      - name: Tests
        working-directory: yarbo-local-ha
        run: uv run pytest -q --cov=custom_components.yarbo_local --cov-fail-under=95
